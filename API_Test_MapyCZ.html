<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mapy.cz Map + Panorama (REST API demo)</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Panorama viewer (deferred so it loads before our script) -->
    <script defer src="https://api.mapy.cz/js/panorama/v1/panorama.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #container {
        display: flex;
        width: 100%;
        height: 100%;
      }
      #map,
      #panorama {
        flex: 1 1 50%;
        height: 100%;
      }
      .leaflet-control-attribution {
        font-size: 11px;
      }
      #attribution-logo {
        position: absolute;
        bottom: 8px;
        left: 8px;
        width: 80px;
        height: auto;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="map"></div>
      <div id="panorama"></div>
    </div>

    <!-- Required attribution logo -->
    <img id="attribution-logo" src="https://mapy.cz/img/logo4-mapy-cz.svg" alt="Mapy.cz" />

    <script>
      // ===================== CONFIG =====================
      const API_KEY = "PpgOEdY7F0t99ALvSN08G_iDtEivZTdcamXY67Jc6-A"; // replace with your Mapy.cz key
      const MAPSET = "basic"; // basic | outdoor | aerial | names-overlay | winter
      const TILE_SIZE = 256; // 256 or 512 (retina)
      const DEFAULT_CENTER = [50.087, 14.421]; // Prague Old‑Town Square
      const DEFAULT_ZOOM = 16;

      // ===================== INITIAL MAP =====================
      const map = L.map("map").setView(DEFAULT_CENTER, DEFAULT_ZOOM);

      L.tileLayer(
        `https://api.mapy.cz/v1/maptiles/${MAPSET}/${TILE_SIZE}/{z}/{x}/{y}?apikey=${API_KEY}`,
        {
          tileSize: TILE_SIZE,
          maxZoom: 20,
          detectRetina: TILE_SIZE === 256,
          attribution:
            '&copy; <a href="https://mapy.cz/">Mapy.cz</a>, © <a href="https://www.openstreetmap.org/copyright">OSM contributors',
        }
      ).addTo(map);

      // Marker that follows user clicks
      let clickMarker = null;

      // ===================== PANORAMA HANDLING =====================
      let panoInstance = null;

      async function showPanorama(lon, lat) {
        if (panoInstance && panoInstance.destroy) {
          panoInstance.destroy();
        }
        try {
          panoInstance = await Panorama.panoramaFromPosition({
            parent: document.getElementById("panorama"),
            lon,
            lat,
            apiKey: API_KEY,
            yaw: "auto",
            showNavigation: true,
            lang: "en",
          });
        } catch (err) {
          console.error("Panorama promise rejected", err);
          document.getElementById("panorama").innerHTML =
            `<p style="padding:1rem;font-size:1rem;color:#555">Failed to load panorama – ${err.message}</p>`;
          return;
        }

        if (panoInstance.errorCode && panoInstance.errorCode !== "NONE") {
          document.getElementById("panorama").innerHTML =
            `<p style="padding:1rem;font-size:1rem;color:#555">No panorama found for this spot (error: ${panoInstance.errorCode}).</p>`;
        }
      }

      function setupInteractions() {
        // Default view
        showPanorama(DEFAULT_CENTER[1], DEFAULT_CENTER[0]);

        map.on("click", (e) => {
          if (!clickMarker) {
            clickMarker = L.marker(e.latlng).addTo(map);
          } else {
            clickMarker.setLatLng(e.latlng);
          }
          showPanorama(e.latlng.lng, e.latlng.lat);
        });
      }

      // Wait for the Panorama script to define global 'Panorama'
      function waitForPanoramaLib(retries = 20) {
        if (window.Panorama && typeof Panorama.panoramaFromPosition === "function") {
          setupInteractions();
        } else if (retries > 0) {
          setTimeout(() => waitForPanoramaLib(retries - 1), 250);
        } else {
          console.error("Panorama library failed to initialise – verify CSP or ad‑blockers.");
        }
      }
      // Kick off the polling once page parsed
      waitForPanoramaLib();
    </script>
  </body>
</html>
