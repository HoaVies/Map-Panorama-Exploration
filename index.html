<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Viewer - Multi Provider</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #map-container {
            flex: 1;
            border-bottom: 2px solid #ccc;
            position: relative;
        }
        #street-view-container {
            flex: 1;
        }
        .provider-selector {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .provider-selector select {
            padding: 5px;
            margin-left: 10px;
        }
        #location-info {
            position: absolute;
            display: none;
            background-color: white;
            padding: 8px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }
        
        /* Custom DOM-based pegman styles */
        .yandex-dom-pegman {
            position: absolute;
            width: 32px;
            height: 32px;
            background-image: url('https://maps.gstatic.com/pegman_v3/pegman_sprite.png');
            background-size: 350px 32px;
            background-position: -44px 0;
            cursor: pointer;
            z-index: 10000; /* Super high z-index to be above everything */
            pointer-events: auto !important; /* Force pointer events */
        }
        .yandex-dom-pegman:hover {
            background-position: -88px 0;
        }
        .yandex-dom-pegman.dragging {
            background-position: -132px 0;
        }
        
        /* Style for when SHIFT key is active */
        .shift-active .yandex-map-click-overlay {
            background-color: rgba(0, 102, 255, 0.1);
            pointer-events: auto !important;
            cursor: crosshair;
        }
        
        .yandex-map-click-overlay.active {
            background-color: rgba(0, 102, 255, 0.1);
            pointer-events: auto !important;
            cursor: crosshair;
        }
    </style>
    <!-- Leaflet CSS for Mapy.cz -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body>
    <div class="provider-selector">
        <label>Map Provider:</label>
        <select id="provider-select">
            <option value="google">Google Maps</option>
            <option value="kakao">Kakao Maps</option>
            <option value="yandex">Yandex Maps</option>
            <option value="mapycz">Mapy.cz</option>
        </select>
    </div>

    <div class="container">
        <div id="map-container"></div>
        <div id="street-view-container"></div>
    </div>
    
    <div id="location-info"></div>

    <!-- Load Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBOlWreS7Z60pod_RUaqhj4pDax4V7kug0"></script>
    
    <!-- Load Kakao Maps API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=bb6dae98d7940acbb68719b7d0a00d14"></script>
    
    <!-- Load Yandex Maps API -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=d14067b3-f5ac-4cfb-b7f9-de9ba7bda726&lang=en_US" type="text/javascript"></script>
    
    <!-- Load Leaflet for Mapy.cz -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <!-- Load Mapy.cz Panorama API with API key -->
    <script>
        // Initialize Mapy.cz API with the key
        window.mapycz_api_key = 'PpgOEdY7F0t99ALvSN08G_iDtEivZTdcamXY67Jc6-A';
    </script>
    <script src="https://api.mapy.cz/js/panorama/v1/panorama.js"></script>
    
    <!-- Load our application -->
    <script type="module" src="dist/index.js"></script>
    
    <script>
        // Add this to your main script to monitor scroll events
        document.addEventListener('DOMContentLoaded', function() {
            const streetViewContainer = document.getElementById('street-view-container');
            
            if (streetViewContainer) {
                // Monitor wheel events for debugging
                streetViewContainer.addEventListener('wheel', function(e) {
                    console.log('Wheel event detected on street-view-container');
                    
                    // Visual indicator that wheel events are being detected
                    streetViewContainer.classList.add('wheel-active');
                    setTimeout(() => {
                        streetViewContainer.classList.remove('wheel-active');
                    }, 300);
                });
                
                // Add class for CSS targeting
                streetViewContainer.classList.add('panorama-container');
                
                console.log('Street view container wheel event monitor initialized');
            }
            
            // Check for any elements that might be capturing events globally
            document.body.addEventListener('wheel', function(e) {
                const target = e.target;
                // Check if the wheel event originated outside our panorama but might affect it
                if (!streetViewContainer.contains(target)) {
                    console.log('Wheel event outside panorama detected on:', target);
                }
            }, true); // Use capture phase to see events before they reach targets
            
            // Track shift key for panorama interaction
            document.addEventListener('keydown', function(e) {
                if (e.shiftKey) {
                    document.body.classList.add('shift-active');
                }
            });
            
            document.addEventListener('keyup', function(e) {
                if (e.key === 'Shift') {
                    document.body.classList.remove('shift-active');
                }
            });
        });
    </script>
</body>
</html>
