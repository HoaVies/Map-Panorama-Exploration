<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://api-maps.yandex.ru/2.1/?apikey=e70f7ab6-1014-42cf-8c97-8dc083bd9fb5&lang=en_RU" type="text/javascript"></script>
    <style>
        #map {
            width: 100%;
            height: 500px;
        }
        #panorama {
            width: 100%;
            height: 500px;
            margin-top: 20px;
        }
        #controls {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="toggleLookup">Toggle Panorama Coverage (Blue Lines)</button>
        <span id="status"></span>
    </div>
    <div id="map"></div>
    <div id="panorama"></div>

    <script type="text/javascript">
        ymaps.ready(function () {
            var myMap = new ymaps.Map('map', {
                center: [55.7558, 37.6173], // Moscow
                zoom: 10,
                type: 'yandex#satellite'
            });

            var panoramaManager = myMap.getPanoramaManager();
            var statusSpan = document.getElementById('status');

            function updateStatus() {
                statusSpan.textContent = panoramaManager.isLookupEnabled() ? "Coverage ON" : "Coverage OFF";
            }

            function toggleLookup() {
                if (panoramaManager.isLookupEnabled()) {
                    panoramaManager.disableLookup();
                } else {
                    panoramaManager.enableLookup();
                }
                updateStatus();
            }

            panoramaManager.enableLookup();
            updateStatus();

            document.getElementById('toggleLookup').onclick = toggleLookup;

            ymaps.panorama.locate(myMap.getCenter()).then(function (panoramas) {
                if (panoramas.length > 0) {
                    ymaps.panorama.createPlayer(
                        'panorama',
                        panoramas[0],
                        { direction: [0, 0], span: [1, 1] }
                    );
                } else {
                    document.getElementById('panorama').innerHTML = 'No panorama available at this location.';
                }
            });
        });
    </script>
</body>
</html>
